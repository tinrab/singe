[package]
name = "singe-cusparse-sys"
description = "Low-level FFI bindings for NVIDIA cuSPARSE, the sparse linear algebra library."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cusparse-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cusparse", "ffi", "sparse"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cusparse_12_8"]

cusparse_12_8 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true
