[package]
name = "singe-cudnn-sys"
description = "Low-level FFI bindings for the NVIDIA cuDNN deep neural network library."
version = "0.1.0-alpha.7"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "cudnn", "bindings", "ffi"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["cudnn_9_27"]

cudnn_9_27 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-cuda-sys.workspace = true
num_enum.workspace = true

[build-dependencies]
singe-cuda-find.workspace = true
anyhow.workspace = true
