[package]
name = "singe-cudnn-sys"
description = "Low-level FFI bindings for the NVIDIA cuDNN deep neural network library."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cudnn-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cudnn", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cudnn_9_27"]

cudnn_9_27 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true
