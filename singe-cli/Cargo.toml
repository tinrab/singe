[package]
name = "singe-cli"
description = "Command-line tools for Singe."
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
keywords = ["singe", "inference", "cli"]
categories = ["command-line-utilities", "science"]

[features]
default = ["cuda_13_4"]
cuda_13_4 = ["singe-model/cuda_13_4", "singe-server/cuda_13_4"]

[dependencies]
anyhow.workspace = true
bytesize.workspace = true
humantime.workspace = true
clap = { workspace = true, features = ["env"] }
singe = { workspace = true, features = ["onnx"] }
singe-model = { workspace = true, features = ["onnx"] }
singe-server = { workspace = true, features = ["onnx"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true

[[bin]]
name = "singe"
path = "src/main.rs"
