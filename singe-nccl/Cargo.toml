[package]
name = "singe-nccl"
description = "Safe Rust wrappers for the NVIDIA Collective Communications Library (NCCL)."
version = "0.1.0-alpha.8"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nccl", "communication"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["nccl_2_32"]

nccl_2_32 = ["singe-nccl-sys/nccl_2_32", "singe-cuda/runtime_13_4", "singe-cuda-sys/runtime_13_4"]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cuda-sys.workspace = true
singe-nccl-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true
