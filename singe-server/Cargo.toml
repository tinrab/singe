[package]
name = "singe-server"
description = "Singe model server."
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-server"
license-file.workspace = true
readme = "README.md"
keywords = ["singe", "inference", "server", "openai"]
categories = ["science", "web-programming::http-server"]
include.workspace = true

[features]
default = ["cuda_13_4"]
cuda_13_4 = ["singe-model/cuda_13_4"]

[dependencies]
axum.workspace = true
futures.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
singe.workspace = true
singe-model.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
