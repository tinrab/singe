[package]
name = "singe-npp"
description = "Safe Rust wrappers for NPP, the NVIDIA Performance Primitives, for image and signal processing on the GPU."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-npp"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "npp", "image-processing", "signal-processing"]
categories = ["api-bindings", "hardware-support", "multimedia::images"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["npp_13_2"]

npp_13_2 = ["singe-cuda/runtime_13_4", "singe-cuda/macros", "singe-npp-sys/npp_13_2"]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-npp-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
image.workspace = true
