[package]
name = "singe-npp"
description = "Safe Rust wrappers for NVIDIA Performance Primitives library (NPP)."
version = "0.1.0-alpha.10"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "npp", "image"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["npp_13_2"]

npp_13_2 = ["singe-cuda/runtime_13_4", "singe-npp-sys/npp_13_2"]

testing = ["singe-cuda/testing"]

[dependencies]
libloading.workspace = true
singe-core.workspace = true
singe-cuda.workspace = true
singe-npp-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
image.workspace = true
