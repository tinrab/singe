[package]
name = "singe-cufft"
description = "Safe Rust wrappers for the NVIDIA cuFFT fast Fourier transform library."
version = "0.1.0-alpha.7"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cufft", "fft"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["cufft_12_4"]

cufft_12_4 = [
    "singe-cuda/runtime_13_4",
    "singe-cuda/nvjitlink_13_4",
    "singe-cuda-sys/runtime_13_4",
    "singe-cufft-sys/cufft_12_4",
]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cuda-sys.workspace = true
singe-cufft-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true
