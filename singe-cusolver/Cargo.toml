[package]
name = "singe-cusolver"
description = "Safe Rust wrappers for NVIDIA cuSOLVER, for dense matrix factorizations and solvers on the GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cusolver"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cusolver", "solver"]
categories = ["api-bindings", "hardware-support", "science"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cusolver_12_3"]

cusolver_12_3 = [
    "singe-cuda/runtime_13_4",
    "singe-cuda-sys/runtime_13_4",
    "singe-cusolver-sys/cusolver_12_3",
]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cuda-sys.workspace = true
singe-cusolver-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
anyhow.workspace = true
