[workspace]
resolver = "3"

members = [
    "singe-core",
    "singe",
    "singe-cli",
    "singe-codegen",
    "singe-cublas",
    "singe-cublas-sys",
    "singe-cuda",
    "singe-cuda-macros",
    "singe-cuda-find",
    "singe-cuda-sys",
    "singe-cuda-emulator",
    "singe-cufile",
    "singe-cufile-sys",
    "singe-curand",
    "singe-curand-sys",
    "singe-cudnn",
    "singe-cudnn-sys",
    "singe-cudss",
    "singe-cudss-sys",
    "singe-cufft",
    "singe-cufft-sys",
    "singe-cusolver",
    "singe-cusolver-sys",
    "singe-cupti",
    "singe-cupti-sys",
    "singe-cusparse",
    "singe-cusparse-sys",
    "singe-cutensor",
    "singe-cutensor-sys",
    "singe-kernel",
    "singe-kernel-sys",
    "singe-loader",
    "singe-macros",
    "singe-model",
    "singe-server",
    "singe-testing",
    "singe-nvml",
    "singe-nvml-sys",
    "singe-nvcomp",
    "singe-nvcomp-sys",
    "singe-nvjpeg",
    "singe-nvjpeg-sys",
    "singe-nvtiff",
    "singe-nvtiff-sys",
    "singe-nvimagecodec",
    "singe-nvimagecodec-sys",
    "singe-nccl",
    "singe-nccl-sys",
    "singe-npp",
    "singe-npp-sys",
    "singe-onnx",
    "singe-ptx",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/tinrab/singe"
license-file = "LICENSE"
include = ["src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE*", "/dist/katex_header.html"]

[workspace.dependencies]
libloading = "0.9.1"
singe-core = { path = "singe-core", version = "0.1.0" }
singe-cublas = { path = "singe-cublas", version = "0.1.0" }
singe-cublas-sys = { path = "singe-cublas-sys", version = "0.1.0", default-features = false }
singe-cuda = { path = "singe-cuda", version = "0.1.0", default-features = false }
singe-cuda-macros = { path = "singe-cuda-macros", version = "0.1.0" }
singe-cuda-find = { path = "singe-cuda-find", version = "0.1.0" }
singe-cuda-sys = { path = "singe-cuda-sys", version = "0.1.0", default-features = false }
singe-cuda-emulator = { path = "singe-cuda-emulator", version = "0.1.0" }
singe-cufile = { path = "singe-cufile", version = "0.1.0" }
singe-cufile-sys = { path = "singe-cufile-sys", version = "0.1.0", default-features = false }
singe-curand = { path = "singe-curand", version = "0.1.0" }
singe-curand-sys = { path = "singe-curand-sys", version = "0.1.0", default-features = false }
singe-cudnn = { path = "singe-cudnn", version = "0.1.0" }
singe-cudnn-sys = { path = "singe-cudnn-sys", version = "0.1.0", default-features = false }
singe-cudss = { path = "singe-cudss", version = "0.1.0" }
singe-cudss-sys = { path = "singe-cudss-sys", version = "0.1.0", default-features = false }
singe-cufft = { path = "singe-cufft", version = "0.1.0" }
singe-cufft-sys = { path = "singe-cufft-sys", version = "0.1.0", default-features = false }
singe-cusolver = { path = "singe-cusolver", version = "0.1.0" }
singe-cusolver-sys = { path = "singe-cusolver-sys", version = "0.1.0", default-features = false }
singe-cupti = { path = "singe-cupti", version = "0.1.0" }
singe-cupti-sys = { path = "singe-cupti-sys", version = "0.1.0", default-features = false }
singe-cusparse = { path = "singe-cusparse", version = "0.1.0" }
singe-cusparse-sys = { path = "singe-cusparse-sys", version = "0.1.0", default-features = false }
singe-cutensor = { path = "singe-cutensor", version = "0.1.0" }
singe-cutensor-sys = { path = "singe-cutensor-sys", version = "0.1.0", default-features = false }
singe-kernel = { path = "singe-kernel", version = "0.1.0" }
singe-loader = { path = "singe-loader", version = "0.1.0" }
singe-macros = { path = "singe-macros", version = "0.1.0-alpha.2" }
singe = { path = "singe", version = "0.1.0-alpha.3" }
singe-codegen = { path = "singe-codegen", version = "0.1.0-alpha.2" }
singe-model = { path = "singe-model", version = "0.1.0-alpha.3" }
singe-server = { path = "singe-server", version = "0.1.0-alpha.3", default-features = false }
singe-testing = { path = "singe-testing" }
singe-nccl = { path = "singe-nccl", version = "0.1.0" }
singe-nccl-sys = { path = "singe-nccl-sys", version = "0.1.0", default-features = false }
singe-npp = { path = "singe-npp", version = "0.1.0" }
singe-npp-sys = { path = "singe-npp-sys", version = "0.1.0", default-features = false }
singe-nvml = { path = "singe-nvml", version = "0.1.0" }
singe-nvml-sys = { path = "singe-nvml-sys", version = "0.1.0", default-features = false }
singe-nvcomp = { path = "singe-nvcomp", version = "0.1.0" }
singe-nvcomp-sys = { path = "singe-nvcomp-sys", version = "0.1.0", default-features = false }
singe-nvjpeg = { path = "singe-nvjpeg", version = "0.1.0" }
singe-nvjpeg-sys = { path = "singe-nvjpeg-sys", version = "0.1.0", default-features = false }
singe-nvtiff = { path = "singe-nvtiff", version = "0.1.0" }
singe-nvtiff-sys = { path = "singe-nvtiff-sys", version = "0.1.0", default-features = false }
singe-nvimagecodec = { path = "singe-nvimagecodec", version = "0.1.0" }
singe-nvimagecodec-sys = { path = "singe-nvimagecodec-sys", version = "0.1.0", default-features = false }
singe-onnx = { path = "singe-onnx", version = "0.1.0" }
singe-ptx = { path = "singe-ptx", version = "0.1.0" }

thiserror = "2.0.21"
num-traits = "0.2.19"
num-rational = "0.4.2"
num-complex = "0.4.6"
num_enum = "0.7.6"
bitflags = "2.13.2"
half = "2.7.1"
libm = "0.2.16"
libc = "0.2.191"
rand = "0.10.4"
rayon = "1.12.0"
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
bytesize = "2.7.0"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
safetensors = "0.8.0"
symphonium = { version = "0.13.0", default-features = false, features = ["all"] }
toml_edit = "0.25"
tokenizers = "0.23.2"
glob = "0.3.4"
regex = "1.13.2"
regex-syntax = "0.8.12"
unicode-normalization-alignments = "0.1.12"
prost = "0.14.6"
nom = "8.0.0"
nom_locate = "5.0.0"
rustc_apfloat = "0.2.3"
image = "0.25.10"
minijinja = { version = "3.1.0", features = ["json", "loop_controls", "serde"] }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"] }
bomboni_core = "0.5.1"
bomboni_serde = "0.5.1"
bomboni_proto = "0.5.1"
bomboni_prost = "0.5.1"
bomboni_request = "0.5.1"
cuda-core = "0.5.0"
cudarc = { version = "0.19.10", default-features = false, features = [
    "std",
    "driver",
    "dynamic-linking",
    "cuda-13040",
] }
oxide-artifacts = "0.2.1"
cutile = "0.5.0"
cutile-compiler = "0.5.0"
cutile-ir = "0.5.0"

pretty_assertions = "1.4.1"
bindgen = "0.73.2"
cc = "1.11.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.10"
prost-build = "0.14.6"
prettyplease = "0.3.0"
sha2 = "0.11.1"
hex = "0.4.3"
directories = "6.0.0"
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
tokio = "1.54.1"
axum = { version = "0.8.9", features = ["http2", "multipart", "ws"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "request-id", "trace", "util"] }
tokio-stream = "0.1.19"
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
toml = "1.2.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.singe-codegen]
opt-level = 3

[workspace.metadata.no-slop.rules]
no-dense-statement-runs = "off"
