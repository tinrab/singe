[workspace]
resolver = "3"

members = [
    "singe-core",
    "singe",
    "singe-codegen",
    "singe-cublas",
    "singe-cublas-sys",
    "singe-cuda",
    "singe-cuda-macros",
    "singe-cuda-find",
    "singe-cuda-sys",
    "singe-cufile",
    "singe-cufile-sys",
    "singe-curand",
    "singe-curand-sys",
    "singe-cudnn",
    "singe-cudnn-sys",
    "singe-cudss",
    "singe-cudss-sys",
    "singe-cufft",
    "singe-cufft-sys",
    "singe-cusolver",
    "singe-cusolver-sys",
    "singe-cupti",
    "singe-cupti-sys",
    "singe-cusparse",
    "singe-cusparse-sys",
    "singe-cutensor",
    "singe-cutensor-sys",
    "singe-kernel",
    "singe-kernel-sys",
    "singe-loader",
    "singe-macros",
    "singe-model",
    "singe-testing",
    "singe-nvml",
    "singe-nvml-sys",
    "singe-nvcomp",
    "singe-nvcomp-sys",
    "singe-nvjpeg",
    "singe-nvjpeg-sys",
    "singe-nvtiff",
    "singe-nvtiff-sys",
    "singe-nvimagecodec",
    "singe-nvimagecodec-sys",
    "singe-nccl",
    "singe-nccl-sys",
    "singe-npp",
    "singe-npp-sys",
    "singe-onnx",
    "singe-ptx",
    "xtask",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/tinrab/singe"
license-file = "LICENSE"
include = ["src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE*", "/dist/katex_header.html"]

[workspace.dependencies]
libloading = "0.8.9"
singe-core = { path = "singe-core", version = "0.1.0-alpha.8" }
singe-cublas = { path = "singe-cublas", version = "0.1.0-alpha.10" }
singe-cublas-sys = { path = "singe-cublas-sys", version = "0.1.0-alpha.9" }
singe-cuda = { path = "singe-cuda", version = "0.1.0-alpha.10" }
singe-cuda-macros = { path = "singe-cuda-macros", version = "0.1.0-alpha.10" }
singe-cuda-find = { path = "singe-cuda-find", version = "0.1.0-alpha.9" }
singe-cuda-sys = { path = "singe-cuda-sys", version = "0.1.0-alpha.9" }
singe-cufile = { path = "singe-cufile", version = "0.1.0-alpha.8" }
singe-cufile-sys = { path = "singe-cufile-sys", version = "0.1.0-alpha.8" }
singe-curand = { path = "singe-curand", version = "0.1.0-alpha.3" }
singe-curand-sys = { path = "singe-curand-sys", version = "0.1.0-alpha.3" }
singe-cudnn = { path = "singe-cudnn", version = "0.1.0-alpha.8" }
singe-cudnn-sys = { path = "singe-cudnn-sys", version = "0.1.0-alpha.8" }
singe-cudss = { path = "singe-cudss", version = "0.1.0-alpha.4" }
singe-cudss-sys = { path = "singe-cudss-sys", version = "0.1.0-alpha.4" }
singe-cufft = { path = "singe-cufft", version = "0.1.0-alpha.8" }
singe-cufft-sys = { path = "singe-cufft-sys", version = "0.1.0-alpha.8" }
singe-cusolver = { path = "singe-cusolver", version = "0.1.0-alpha.8" }
singe-cusolver-sys = { path = "singe-cusolver-sys", version = "0.1.0-alpha.8" }
singe-codegen = { path = "singe-codegen", version = "0.1.0-alpha.1" }
singe-cupti = { path = "singe-cupti", version = "0.1.0-alpha.9" }
singe-cupti-sys = { path = "singe-cupti-sys", version = "0.1.0-alpha.8" }
singe-cusparse = { path = "singe-cusparse", version = "0.1.0-alpha.8" }
singe-cusparse-sys = { path = "singe-cusparse-sys", version = "0.1.0-alpha.8" }
singe-cutensor = { path = "singe-cutensor", version = "0.1.0-alpha.8" }
singe-cutensor-sys = { path = "singe-cutensor-sys", version = "0.1.0-alpha.8" }
singe-kernel = { path = "singe-kernel", version = "0.1.0-alpha.5" }
singe-loader = { path = "singe-loader", version = "0.1.0-alpha.1" }
singe-macros = { path = "singe-macros", version = "0.1.0-alpha.7" }
singe = { path = "singe", version = "0.1.0-alpha.1" }
singe-model = { path = "singe-model", version = "0.1.0-alpha.1" }
singe-testing = { path = "singe-testing" }
singe-nccl = { path = "singe-nccl", version = "0.1.0-alpha.9" }
singe-nccl-sys = { path = "singe-nccl-sys", version = "0.1.0-alpha.8" }
singe-npp = { path = "singe-npp", version = "0.1.0-alpha.11" }
singe-npp-sys = { path = "singe-npp-sys", version = "0.1.0-alpha.9" }
singe-nvml = { path = "singe-nvml", version = "0.1.0-alpha.10" }
singe-nvml-sys = { path = "singe-nvml-sys", version = "0.1.0-alpha.8" }
singe-nvcomp = { path = "singe-nvcomp", version = "0.1.0-alpha.1" }
singe-nvcomp-sys = { path = "singe-nvcomp-sys", version = "0.1.0-alpha.1" }
singe-nvjpeg = { path = "singe-nvjpeg", version = "0.1.0-alpha.1" }
singe-nvjpeg-sys = { path = "singe-nvjpeg-sys", version = "0.1.0-alpha.1" }
singe-nvtiff = { path = "singe-nvtiff", version = "0.1.0-alpha.1" }
singe-nvtiff-sys = { path = "singe-nvtiff-sys", version = "0.1.0-alpha.1" }
singe-nvimagecodec = { path = "singe-nvimagecodec", version = "0.1.0-alpha.1" }
singe-nvimagecodec-sys = { path = "singe-nvimagecodec-sys", version = "0.1.0-alpha.1" }
singe-onnx = { path = "singe-onnx", version = "0.1.0-alpha.8" }
singe-ptx = { path = "singe-ptx", version = "0.1.0-alpha.8" }

thiserror = "2.0.21"
num-traits = "0.2.19"
num-rational = "0.4.2"
num-complex = "0.4.6"
num_enum = "0.7.6"
bitflags = "2.13.2"
lazy_static = "1.5.1"
half = "2.7.1"
libm = "0.2.16"
rand = "0.10.3"
rayon = "1.12.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
safetensors = "0.8.0"
symphonium = "0.13.0"
toml_edit = "0.25"
tokenizers = "0.23.2"
glob = "0.3.4"
regex = "1.13.1"
prost = "0.14.4"
nom = "8.0.0"
nom_locate = "5.0.0"
rustc_apfloat = "0.2.3"
image = "0.25.10"
bomboni_core = "0.5.1"
bomboni_serde = "0.5.1"
bomboni_proto = "0.5.1"
bomboni_prost = "0.5.1"
bomboni_request = "0.5.1"
cuda-core = "0.4.0"
cudarc = { version = "0.19.10", default-features = false, features = [
    "std",
    "driver",
    "dynamic-linking",
    "cuda-13040",
] }
oxide-artifacts = "0.2.1"
cutile = "0.4.0"
cutile-compiler = "0.4.0"
cutile-ir = "0.4.0"

pretty_assertions = "1.4.1"
bindgen = "0.73.2"
cc = "1.8.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"
prost-build = "0.14.4"
prettyplease = "0.3.0"
sha2 = "0.11.1"
hex = "0.4.3"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tokio = "1.53.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.singe-codegen]
opt-level = 3

[workspace.metadata.no-slop.rules]
no-dense-statement-runs = "off"
