[package]
name = "singe-cupti"
description = "Safe Rust wrappers for NVIDIA CUPTI, the CUDA Profiling Tools Interface, for tracing and profiling CUDA applications."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cupti"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cupti", "profiling", "tracing"]
categories = ["api-bindings", "hardware-support", "development-tools::profiling"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cupti_13_4"]

cupti_13_4 = ["singe-cuda/runtime_13_4", "singe-cupti-sys/cupti_13_4"]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cupti-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
anyhow.workspace = true
