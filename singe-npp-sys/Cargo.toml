[package]
name = "singe-npp-sys"
description = "Low-level FFI bindings for the NVIDIA Performance Primitives library (NPP)."
version = "0.1.0-alpha.8"
edition.workspace = true
repository.workspace = true
license-file = "../LICENSE"
readme = "README.md"
keywords = ["cuda", "npp", "bindings", "ffi"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["npp_13_1"]

npp_13_1 = ["singe-cuda-sys/runtime_13_3"]

[dependencies]
singe-cuda-sys.workspace = true
num_enum.workspace = true

[build-dependencies]
singe-cuda-find.workspace = true
anyhow.workspace = true
