[package]
name = "singe-nccl-sys"
description = "Low-level FFI bindings for the NVIDIA Collective Communications Library (NCCL)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nccl-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nccl", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nccl_2_32"]

nccl_2_32 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true
