[package]
name = "singe-nvimagecodec-sys"
description = "Low-level FFI bindings for the NVIDIA nvImageCodec library."
version = "0.1.0-alpha.1"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvimagecodec", "bindings", "ffi"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvimagecodec_0_9"]

nvimagecodec_0_9 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true
num_enum.workspace = true
