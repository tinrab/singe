[project]
name = "singe-vllm-comparison"
version = "0.1.0"
description = "vLLM's side of the generation comparison, in an environment of its own, since vLLM pins its own torch and Python."
requires-python = ">=3.12,<3.13"
dependencies = ["vllm==0.34.0"]

[tool.uv]
# The development shell is x86_64 Linux only, as `flake.nix` defines it, so the lock resolves for Linux alone.
environments = ["sys_platform == 'linux'"]
