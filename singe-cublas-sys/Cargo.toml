[package]
name = "singe-cublas-sys"
description = "Low-level FFI bindings for NVIDIA cuBLAS, cuBLASLt, and cuBLASXt."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cublas-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cublas", "ffi", "cublaslt"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
features = ["lt", "xt"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cublas_13_8"]

cublas_13_8 = ["singe-cuda-sys/runtime_13_4"]
lt = ["cublas_13_8"]
xt = ["cublas_13_8"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true
