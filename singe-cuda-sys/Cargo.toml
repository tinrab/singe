[package]
name = "singe-cuda-sys"
description = "Low-level FFI bindings for the CUDA driver and runtime APIs and the CUDA libraries that ship with them, such as NVRTC."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cuda-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "ffi", "bindings", "nvtx"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["driver_13_4", "runtime_13_4", "nvrtc_13_4", "nvvm_13_4", "nvtx_3", "nvjitlink_13_4"]

nvjitlink_13_4 = []

driver = []
driver_13_4 = ["driver"]

runtime = []
runtime_13_4 = ["runtime", "driver_13_4"]

nvrtc = []
nvrtc_13_4 = ["nvrtc"]

nvvm = []
nvvm_13_4 = ["nvvm"]

nvtx = []
nvtx_3 = ["nvtx"]

[dependencies]
singe-loader.workspace = true

[dev-dependencies]
anyhow.workspace = true
