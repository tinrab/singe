[package]
name = "singe-cuda-sys"
description = "Low-level FFI bindings for CUDA driver, runtime, NVRTC, NVVM, NVTX, and related NVIDIA APIs."
version = "0.1.0-alpha.8"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "ffi", "bindings", "nvtx"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["driver_13_4", "runtime_13_4", "nvrtc_13_4", "nvvm_13_4", "nvtx_3", "nvjitlink_13_4"]

nvjitlink_13_4 = []

driver = []
driver_13_4 = ["driver"]

runtime = []
runtime_13_4 = ["runtime"]

nvrtc = []
nvrtc_13_4 = ["nvrtc"]

nvvm = []
nvvm_13_4 = ["nvvm"]

nvtx = []
nvtx_3 = ["nvtx"]

[dependencies]
num_enum.workspace = true

[build-dependencies]
singe-cuda-find.workspace = true
