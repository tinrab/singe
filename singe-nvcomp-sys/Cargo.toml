[package]
name = "singe-nvcomp-sys"
description = "Low-level FFI bindings for the NVIDIA nvCOMP compression library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvcomp-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nvcomp", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support"]
include = [
    "src/**/*.rs",
    "/build.rs",
    "cpp/bridge.h",
    "cpp/bridge.cc",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
    "/dist/katex_header.html",
]

[package.metadata.docs.rs]
features = ["manager"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvcomp_6_0"]

nvcomp_6_0 = ["singe-cuda-sys/runtime_13_4"]

# Builds the C++ manager bridge, which links nvCOMP at build time.
manager = ["nvcomp_6_0"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true

[build-dependencies]
cc.workspace = true
singe-cuda-find.workspace = true
