[package]
name = "singe-nvcomp-sys"
description = "Low-level FFI bindings for the NVIDIA nvCOMP compression library."
version = "0.1.0-alpha.1"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvcomp", "compression", "bindings", "ffi"]
include = [
    "src/**/*.rs",
    "/build.rs",
    "cpp/bridge.h",
    "cpp/bridge.cc",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
    "/dist/katex_header.html",
]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvcomp_6_0"]

nvcomp_6_0 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true
num_enum.workspace = true

[build-dependencies]
cc.workspace = true
singe-cuda-find.workspace = true
