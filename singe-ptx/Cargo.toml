[package]
name = "singe-ptx"
description = "PTX parser and emulator."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-ptx"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "ptx", "parser"]
categories = ["parser-implementations", "emulators"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[dependencies]
thiserror.workspace = true
nom.workspace = true
nom_locate.workspace = true
rustc_apfloat.workspace = true
half.workspace = true

[dev-dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
