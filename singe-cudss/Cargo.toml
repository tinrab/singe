[package]
name = "singe-cudss"
description = "Safe Rust wrappers for NVIDIA cuDSS, for solving sparse linear systems with direct methods on one or several GPUs."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cudss"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cudss", "sparse", "solver"]
categories = ["api-bindings", "hardware-support", "science"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cudss_1_0"]

cudss_1_0 = [
    "singe-cuda/runtime_13_4",
    "singe-cuda/macros",
    "singe-cuda-sys/runtime_13_4",
    "singe-cudss-sys/cudss_1_0",
]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cuda-sys.workspace = true
singe-cudss-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
anyhow.workspace = true
