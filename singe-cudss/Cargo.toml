[package]
name = "singe-cudss"
description = "Safe Rust wrappers for NVIDIA cuDSS, the CUDA direct sparse solver library."
version = "0.1.0-alpha.4"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cudss", "sparse", "solver"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["cudss_0_8"]

cudss_0_8 = ["singe-cuda/runtime_13_4", "singe-cudss-sys/cudss_0_8"]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cuda-sys.workspace = true
singe-cudss-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
rand.workspace = true
