[package]
name = "singe-nvml-sys"
description = "Low-level FFI bindings for NVML, the NVIDIA Management Library."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvml-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["nvidia", "nvml", "ffi", "gpu", "monitoring"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvml_13"]

nvml_13 = []

[dependencies]
singe-loader.workspace = true

[dev-dependencies]
anyhow.workspace = true
