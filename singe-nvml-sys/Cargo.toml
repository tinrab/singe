[package]
name = "singe-nvml-sys"
description = "Low-level FFI bindings for the NVIDIA Management Library (NVML)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvml-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nvml", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvml_13"]

nvml_13 = []

[dependencies]
singe-loader.workspace = true

[dev-dependencies]
anyhow.workspace = true
