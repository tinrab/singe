[package]
name = "singe-nvml"
description = "Safe Rust wrappers for NVML, the NVIDIA Management Library, for monitoring and managing GPUs."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvml"
license-file.workspace = true
readme = "README.md"
keywords = ["nvidia", "nvml", "gpu", "monitoring", "nvidia-smi"]
categories = ["api-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvml_13"]

nvml_13 = ["singe-nvml-sys/nvml_13"]

[dependencies]
singe-core.workspace = true
singe-nvml-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
anyhow.workspace = true
