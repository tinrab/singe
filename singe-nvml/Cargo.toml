[package]
name = "singe-nvml"
description = "Safe Rust wrappers for the NVIDIA Management Library (NVML), for monitoring and managing GPUs."
version = "0.1.0-alpha.10"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["nvidia", "nvml", "gpu", "monitoring"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvml_615"]

nvml_615 = ["singe-nvml-sys/nvml_615"]

[dependencies]
singe-core.workspace = true
singe-nvml-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

