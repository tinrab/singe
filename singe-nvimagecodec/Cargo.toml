[package]
name = "singe-nvimagecodec"
description = "Safe Rust wrappers for NVIDIA nvImageCodec, for decoding and encoding JPEG, JPEG 2000, TIFF, PNG, BMP, and other image formats on the GPU or CPU."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvimagecodec"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nvimagecodec", "image", "codec"]
categories = ["api-bindings", "hardware-support", "multimedia::images"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvimagecodec_0_9"]

nvimagecodec_0_9 = ["singe-cuda/runtime_13_4", "singe-nvimagecodec-sys/nvimagecodec_0_9"]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-nvimagecodec-sys.workspace = true
thiserror.workspace = true
bitflags.workspace = true
num_enum.workspace = true

[dev-dependencies]
anyhow.workspace = true
