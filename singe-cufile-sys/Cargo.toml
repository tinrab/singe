[package]
name = "singe-cufile-sys"
description = "Low-level FFI bindings for the NVIDIA cuFile GPUDirect Storage library."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cufile-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cufile", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cufile_1_19"]

cufile_1_19 = ["singe-cuda-sys/driver_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true
