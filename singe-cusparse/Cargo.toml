[package]
name = "singe-cusparse"
description = "Safe Rust wrappers for NVIDIA cuSPARSE, for sparse matrix products, format conversions, and triangular solves on the GPU."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cusparse"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cusparse", "sparse", "linear-algebra"]
categories = ["api-bindings", "hardware-support", "science"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cusparse_12_8"]

cusparse_12_8 = ["singe-cuda/runtime_13_4", "singe-cusparse-sys/cusparse_12_8"]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cusparse-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
anyhow.workspace = true
