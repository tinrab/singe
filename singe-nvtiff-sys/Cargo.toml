[package]
name = "singe-nvtiff-sys"
description = "Low-level FFI bindings for NVIDIA nvTIFF, the TIFF codec library."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvtiff-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nvtiff", "ffi", "tiff"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvtiff_0_8"]

nvtiff_0_8 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true
