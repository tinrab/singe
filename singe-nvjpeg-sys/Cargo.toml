[package]
name = "singe-nvjpeg-sys"
description = "Low-level FFI bindings for the NVIDIA nvJPEG and nvJPEG 2000 libraries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvjpeg-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nvjpeg", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
features = ["k2"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvjpeg_13_2"]

nvjpeg_13_2 = ["singe-cuda-sys/runtime_13_4"]
k2 = ["nvjpeg_13_2", "singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true

[dev-dependencies]
anyhow.workspace = true
