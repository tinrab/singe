[project]
name = "singe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.10",
    "autogluon-tabular[mitra]>=1.6.3",
    "diffusers>=0.43.0",
    "jinja2>=3.1.6",
    "librosa>=1.0.1",
    "num2words>=0.5.14",
    "onnx==1.23.2",
    "onnxruntime>=1.32.0",
    "onnxscript>=0.7.0",
    "pillow>=13.0.0",
    "protobuf>=7.36.1",
    "pyarrow>=24.0.0",
    "scipy>=1.18.1",
    "sentence-transformers>=6.3.0",
    "sentencepiece>=0.2.3",
    "soundfile>=0.14.0",
    "timm>=1.0.31",
    "torch>=2.12.0",
    "torchvision==0.27.0",
    "transformers>=5.22.2",
]

[tool.uv]
# The development shell is x86_64 Linux only, as `flake.nix` defines it, so the lock resolves for Linux alone.
environments = ["sys_platform == 'linux'"]
