[package]
name = "singe-cupti-sys"
description = "Low-level FFI bindings for the NVIDIA CUPTI profiling library."
version = "0.1.0-alpha.8"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["nvidia", "cupti", "profiling", "ffi", "cuda"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["cupti_13_4"]

cupti_13_4 = []

[dependencies]
singe-loader.workspace = true
num_enum.workspace = true
