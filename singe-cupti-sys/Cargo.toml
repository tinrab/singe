[package]
name = "singe-cupti-sys"
description = "Low-level FFI bindings for the NVIDIA CUPTI profiling library."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cupti-sys"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cupti", "ffi", "bindings"]
categories = ["external-ffi-bindings", "hardware-support"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cupti_13_4"]

cupti_13_4 = []

[dependencies]
singe-loader.workspace = true

[dev-dependencies]
anyhow.workspace = true
