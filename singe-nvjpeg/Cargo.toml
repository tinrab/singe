[package]
name = "singe-nvjpeg"
description = "Safe Rust wrappers for the NVIDIA nvJPEG and nvJPEG 2000 libraries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-nvjpeg"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "nvjpeg", "jpeg", "image"]
categories = ["api-bindings", "hardware-support", "multimedia::images"]
include.workspace = true

[package.metadata.docs.rs]
features = ["k2"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["nvjpeg_13_2"]

nvjpeg_13_2 = ["singe-cuda/runtime_13_4", "singe-nvjpeg-sys/nvjpeg_13_2"]
k2 = ["nvjpeg_13_2", "singe-nvjpeg-sys/k2"]
testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-nvjpeg-sys.workspace = true
thiserror.workspace = true
bitflags.workspace = true
num_enum.workspace = true

[dev-dependencies]
anyhow.workspace = true

[[example]]
name = "jpeg2k_encode"
required-features = ["k2"]

[[example]]
name = "jpeg2k_decode"
required-features = ["k2"]
