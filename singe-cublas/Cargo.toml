[package]
name = "singe-cublas"
description = "Safe Rust wrappers for the NVIDIA cuBLAS dense linear algebra library (with cuBLASLt and cuBLASXt)."
version = "0.1.0-alpha.9"
edition.workspace = true
repository.workspace = true
keywords = ["cuda", "nvidia", "cublas", "blas"]
license-file = "../LICENSE"
readme = "README.md"
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["cublas_13_5"]

cublas_13_5 = [
    "singe-cublas-sys/cublas_13_5",
    "singe-cuda/runtime_13_3",
    "singe-cuda-sys/runtime_13_3",
]

testing = ["singe-cuda/testing"]
lt = ["cublas_13_5", "singe-cublas-sys/lt"]
xt = ["cublas_13_5", "singe-cublas-sys/xt"]

[dependencies]
singe-core.workspace = true
singe-cublas-sys.workspace = true
singe-cuda.workspace = true
singe-cuda-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true


[[example]]
name = "lt_epilogue"
path = "examples/lt/lt_epilogue.rs"
required-features = ["lt"]

[[example]]
name = "lt_sgemm"
path = "examples/lt/lt_sgemm.rs"
required-features = ["lt"]

