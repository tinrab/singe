# MiniLM pooling by the mean over the square root of the length, which no published model with safetensors does, without normalizing, which would hide the pooling's scale.
MINILM_SQRT_POOLING = { base = "MINILM", replace = { "1_Pooling/config.json" = "text/bert/mean-sqrt-pooling.json", "modules.json" = "text/bert/mean-sqrt-modules.json" } }
