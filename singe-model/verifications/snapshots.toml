BERT_TINY_SPAM = "mrm8488/bert-tiny-finetuned-sms-spam-detection"
BIGBIRD = { repository = "google/bigbird-roberta-base", revision = "refs/pr/2" }
BITNET = "microsoft/bitnet-b1.58-2B-4T"
CLAP = { repository = "laion/clap-htsat-unfused", revision = "refs/pr/3" }
