[package]
name = "singe-model"
description = "Model definitions built on Singe."
version = "0.1.0-alpha.1"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false
keywords = ["singe", "inference", "model", "neural-network"]
include.workspace = true

[features]
default = []
cuda_13_4 = ["singe/cuda_13_4", "singe-testing/cuda_13_4"]

[dependencies]
singe.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true

[dev-dependencies]
anyhow.workspace = true
image.workspace = true
singe-cupti.workspace = true
singe-testing.workspace = true

[[example]]
name = "generate"
required-features = ["cuda_13_4"]

[[example]]
name = "embed"
required-features = ["cuda_13_4"]

[[example]]
name = "transcribe"
required-features = ["cuda_13_4"]

[[example]]
name = "image_features"
required-features = ["cuda_13_4"]

[[example]]
name = "autoencode"
required-features = ["cuda_13_4"]

[[example]]
name = "profile"
required-features = ["cuda_13_4"]

[[bench]]
name = "models"
harness = false
required-features = ["cuda_13_4"]
