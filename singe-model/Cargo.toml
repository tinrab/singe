[package]
name = "singe-model"
description = "Model definitions built on Singe."
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-model"
license-file.workspace = true
readme = "README.md"
keywords = ["singe", "inference", "model", "neural-network"]
categories = ["science"]
include.workspace = true

[features]
default = []
cuda_13_4 = ["singe/cuda_13_4", "singe-testing/cuda_13_4"]
onnx = ["singe/onnx", "dep:singe-onnx"]

[dependencies]
rayon.workspace = true
singe.workspace = true
singe-onnx = { workspace = true, optional = true }
image.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
regex-syntax.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
symphonium.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
unicode-normalization-alignments.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true
singe-testing.workspace = true
toml_edit.workspace = true

[[example]]
name = "generate"
required-features = ["cuda_13_4"]

[[example]]
name = "compare"
required-features = ["cuda_13_4"]

[[example]]
name = "pipeline"
required-features = ["cuda_13_4"]

[[example]]
name = "convert"
required-features = ["cuda_13_4"]

[[example]]
name = "profile"
required-features = ["cuda_13_4"]

[[test]]
name = "verifications"
path = "verifications/main.rs"
harness = false
test = false
required-features = ["cuda_13_4", "onnx"]

[[bench]]
name = "models"
harness = false
required-features = ["cuda_13_4"]
