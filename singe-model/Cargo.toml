[package]
name = "singe-model"
description = "Model definitions built on Singe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false
keywords = ["singe", "inference", "model", "neural-network"]
categories = ["science"]
include.workspace = true

[features]
default = []
cuda_13_4 = ["singe/cuda_13_4", "singe-testing/cuda_13_4"]

[dependencies]
singe.workspace = true
image.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
regex-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
unicode-normalization-alignments.workspace = true

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true
singe-cupti.workspace = true
singe-testing.workspace = true
toml_edit.workspace = true

[[example]]
name = "generate"
required-features = ["cuda_13_4"]

[[example]]
name = "pipeline"
required-features = ["cuda_13_4"]

[[example]]
name = "convert"
required-features = ["cuda_13_4"]

[[example]]
name = "profile"
required-features = ["cuda_13_4"]

# Run only when named, as `just verify` names it, since each loads models from local snapshots.
[[test]]
name = "verifications"
path = "verifications/main.rs"
harness = false
test = false
required-features = ["cuda_13_4"]

[[bench]]
name = "models"
harness = false
required-features = ["cuda_13_4"]
