[package]
name = "singe-cuda-macros"
description = "Derive macros for types that can be copied to the GPU, and `cuda_module!` for typed CUDA kernel launches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cuda-macros"
license-file.workspace = true
readme = "README.md"
keywords = ["singe", "cuda", "ptx", "macros", "nvidia"]
categories = ["development-tools::procedural-macro-helpers"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
sha2.workspace = true
hex.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
