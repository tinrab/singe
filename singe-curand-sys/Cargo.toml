[package]
name = "singe-curand-sys"
description = "Low-level FFI bindings for the NVIDIA cuRAND random number generation library."
version = "0.1.0-alpha.3"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "curand", "bindings", "ffi"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["curand_13_4"]

curand_13_4 = ["singe-cuda-sys/runtime_13_4"]

[dependencies]
singe-loader.workspace = true
singe-cuda-sys.workspace = true
num_enum.workspace = true
