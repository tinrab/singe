[package]
name = "singe-cufile"
description = "Safe Rust wrappers for NVIDIA cuFile, for reading and writing files directly to GPU memory with GPUDirect Storage."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/singe-cufile"
license-file.workspace = true
readme = "README.md"
keywords = ["cuda", "nvidia", "cufile", "gpudirect", "storage"]
categories = ["api-bindings", "hardware-support", "filesystem"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "dist/katex_header.html"]

[features]
default = ["cufile_1_19"]

cufile_1_19 = ["singe-cuda/runtime_13_4", "singe-cufile-sys/cufile_1_19"]

testing = ["singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cufile-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true

[dev-dependencies]
anyhow.workspace = true
libc.workspace = true
