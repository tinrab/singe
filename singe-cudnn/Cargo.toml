[package]
name = "singe-cudnn"
description = "Safe Rust wrappers for the NVIDIA cuDNN deep neural network library. Includes backend and frontend APIs."
version = "0.1.0-alpha.6"
edition.workspace = true
repository.workspace = true
license-file = "../LICENSE"
readme = "README.md"
keywords = ["cuda", "cudnn", "tensor", "deep-learning"]
include.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "dist/katex_header.html"]

[features]
default = ["cudnn_9_22"]

cudnn_9_22 = ["singe-cudnn-sys/cudnn_9_22"]

testing = ["dep:lazy_static", "singe-cuda/testing"]

[dependencies]
singe-core.workspace = true
singe-cuda.workspace = true
singe-cuda-find.workspace = true
singe-cudnn-sys.workspace = true
thiserror.workspace = true
num_enum.workspace = true
bitflags.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
bomboni_serde.workspace = true
sha2.workspace = true
hex.workspace = true

lazy_static = { workspace = true, optional = true }

[dev-dependencies]
singe-cublas.workspace = true

