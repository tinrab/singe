[package]
name = "singe-macros"
description = "Procedural macros for the Singe framework."
version = "0.1.0-alpha.7"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
publish = false
readme = "README.md"
keywords = ["singe", "macros", "tensor"]
