[package]
name = "singe-kernel"
description = "Reusable CPU and GPU kernels."
version = "0.1.0-alpha.4"
edition.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "README.md"
keywords = ["singe", "cuda", "kernel", "gpu"]
include = ["**/*.rs", "Cargo.toml", "dist", "README.md", "LICENSE*", "docs/**/*.md"]

[features]
default = ["dtype_f32"]
cutile = [
    "cuda_13_4",
    "dep:cutile",
    "dep:cutile-compiler",
    "dep:singe-cuda",
    "dep:cuda-core",
    "singe-cuda/interop_cuda_core",
]
cuda_13_4 = ["dep:singe-cuda"]
serde = ["dep:serde"]
dtype_f32 = []
dtype_f16 = []
dtype_bf16 = []
dtype_f64 = []
dtype_f8 = []
dtype_i8 = []
dtype_u8 = []
dtype_i32 = []
dtype_u32 = []
dtype_i64 = []
dtype_u64 = []
dtypes_all = [
    "dtype_f32",
    "dtype_f16",
    "dtype_bf16",
    "dtype_f64",
    "dtype_f8",
    "dtype_i8",
    "dtype_u8",
    "dtype_i32",
    "dtype_u32",
    "dtype_i64",
    "dtype_u64",
]
kernel_activation = ["cutile"]
kernel_attention = ["cutile"]
kernel_audio = ["cutile", "dtype_f32", "kernel_shape"]
kernel_cast = ["cutile"]
kernel_conv = ["cutile"]
kernel_creation = ["cutile"]
kernel_elementwise = ["cutile"]
kernel_embedding = ["cutile"]
kernel_fft = ["cutile", "kernel_scalar"]
kernel_fused = ["cutile", "kernel_positional"]
kernel_gather = ["cutile"]
kernel_matmul = ["cutile", "dtype_f32"]
kernel_mask = ["cutile", "dtype_u8"]
kernel_moe = ["cutile", "dtype_i32", "kernel_matmul", "kernel_gather"]
kernel_normalization = ["cutile"]
kernel_pooling = ["cutile"]
kernel_positional = ["cutile"]
kernel_quantization = ["cutile", "dtype_f32", "dtype_f8"]
kernel_reduction = ["cutile"]
kernel_recurrent = ["cutile", "dtype_f32"]
kernel_scalar = ["cutile"]
kernel_shape = ["cutile"]
kernel_softmax = ["cutile"]
kernel_unary = ["cutile"]
kernels_all = [
    "kernel_activation",
    "kernel_attention",
    "kernel_audio",
    "kernel_cast",
    "kernel_conv",
    "kernel_creation",
    "kernel_elementwise",
    "kernel_embedding",
    "kernel_fft",
    "kernel_fused",
    "kernel_gather",
    "kernel_matmul",
    "kernel_mask",
    "kernel_moe",
    "kernel_normalization",
    "kernel_pooling",
    "kernel_positional",
    "kernel_quantization",
    "kernel_reduction",
    "kernel_recurrent",
    "kernel_scalar",
    "kernel_shape",
    "kernel_softmax",
    "kernel_unary",
]
full = ["cutile", "kernels_all", "dtypes_all"]

[dependencies]
thiserror.workspace = true
half.workspace = true
num-complex.workspace = true
serde = { workspace = true, optional = true }
cutile = { workspace = true, optional = true }
cutile-compiler = { workspace = true, optional = true }
singe-cuda = { workspace = true, optional = true }
# we need this because it exports `DriverError`
cuda-core = { workspace = true, optional = true }

[dev-dependencies]
singe-core.workspace = true
serde_json.workspace = true
